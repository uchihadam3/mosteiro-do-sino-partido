# Publishes the game to GitHub Pages on every push to main.
# Installed copies (PWA) pick up the new build through the service worker's "Atualizar agora" prompt.
name: Publicar jogo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
        env:
          BUILD_ID: ${{ github.run_number }}-${{ github.sha }}
      # the built site goes to the gh-pages branch, which GitHub Pages serves
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          force_orphan: true
          commit_message: 'Publicar build ${{ github.sha }}'
